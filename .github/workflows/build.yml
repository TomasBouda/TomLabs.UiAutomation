name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token for nuget.org Trusted Publishing (no long-lived API key)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/TomLabs.UiAutomation -c Release -o nupkg --no-build
      - run: dotnet pack src/TomLabs.UiAutomation.Tool -c Release -o nupkg --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
      # Tags v<version> publish to nuget.org through Trusted Publishing: a policy on nuget.org (owner TomasBouda,
      # repository TomLabs.UiAutomation, workflow build.yml) exchanges the OIDC token for a one-hour API key.
      # The version comes from Directory.Build.props and must match the tag. "user" is the nuget.org profile name.
      - name: NuGet login (OIDC -> temporary API key)
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TomasBouda
      - name: NuGet push
        if: startsWith(github.ref, 'refs/tags/v')
        # One push per file: dotnet nuget push does not expand a quoted glob on Windows.
        run: |
          foreach ($package in Get-ChildItem nupkg/*.nupkg) {
            dotnet nuget push $package.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
